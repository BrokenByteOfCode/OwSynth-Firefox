<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OwSynth Properties</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'MS Sans Serif', Tahoma, sans-serif;
      background-color: #c0c0c0;
      margin: 0;
      padding: 10px;
      font-size: 11px;
      color: #000;
    }
    
    .window {
      width: 400px;
      margin: 0 auto;
      border: 2px solid #fff;
      border-right-color: #808080;
      border-bottom-color: #808080;
      box-shadow: 1px 1px 0 #000;
      padding: 2px;
    }
    
    .title-bar {
      background: #000080;
      color: white;
      padding: 2px 4px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }

    .content-area { padding: 12px; }

    fieldset {
      border: 2px solid #808080;
      border-right-color: #fff;
      border-bottom-color: #fff;
      padding: 10px;
      margin-bottom: 12px;
    }

    legend { padding: 0 4px; }

    .file-input-wrapper {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      padding: 2px;
      border: 2px solid #808080;
      border-right-color: #fff;
      border-bottom-color: #fff;
      background: #eeeeee;
      font-family: inherit;
      font-size: 11px;
    }

    button {
      background: #c0c0c0;
      border: 2px solid #fff;
      border-right-color: #808080;
      border-bottom-color: #808080;
      box-shadow: 1px 1px 0 #000;
      color: #000;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    button:active {
      border: 2px solid #808080;
      border-right-color: #fff;
      border-bottom-color: #fff;
      box-shadow: none;
      transform: translate(1px, 1px);
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    #status {
      margin-bottom: 8px;
      padding: 4px;
      text-align: center;
      font-weight: bold;
      min-height: 15px;
    }
    .success { color: #000080; }
    .error { color: #ff0000; }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <span>OwSynth Properties</span>
    </div>
    
    <div class="content-area">
      <div id="status"></div>

      <fieldset>
        <legend>Soundfont (.SF2)</legend>
        <div class="file-input-wrapper">
          <input type="text" id="current-file-name" readonly placeholder="(None) using Default">
          <button id="browse-btn">Browse...</button>
        </div>
        <input type="file" id="sf2-file-input" accept=".sf2" style="display: none;">
      </fieldset>

      <fieldset>
        <legend>Synthesis Mode</legend>
        <div>
          <input type="checkbox" id="use-sine-checkbox">
          <label for="use-sine-checkbox">Disable SF2 (Use Sine Wave)</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Page scanning blacklist</legend>
        <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
          <input type="text" id="blacklist-input" placeholder="e.g. mail.google.com or google.com" style="flex:1; padding:2px;">
          <button id="blacklist-add-btn">Add</button>
        </div>
        <ul id="blacklist-list" style="list-style:none; padding:0; margin:0; max-height:120px; overflow:auto; border:1px solid #808080; background:#f7f7f7;"></ul>
        <div style="margin-top:6px; font-size:11px; color:#333;">Entries match by domain suffix (example: <code>gmail.com</code> will match <code>mail.gmail.com</code>).</div>
      </fieldset>
      <fieldset>
        <legend>About / Credits</legend>
        <div style="font-size:12px; line-height:1.3;">
          <strong>OwSynth</strong> © 2026 BrokenByteOfCode
          <div style="margin-top:6px;">Icon: Windows 95 speaker icon (© Microsoft).</div>
        </div>
      </fieldset>
      <div class="action-bar">
        <button id="save-btn">Apply</button>
        <button id="reset-btn">Reset</button>
      </div>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
