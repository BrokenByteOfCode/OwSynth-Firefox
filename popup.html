<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OwSynth</title>
  <style>
    body {
      width: 240px;
      padding: 4px;
      margin: 0;
      background-color: #c0c0c0;
      font-family: 'MS Sans Serif', Tahoma, sans-serif;
      font-size: 11px;
    }
    
    .window {
      border: 2px solid #fff;
      border-right-color: #808080;
      border-bottom-color: #808080;
      box-shadow: 1px 1px 0 #000;
      padding: 2px;
    }
    
    .title-bar {
      background: #000080;
      color: white;
      padding: 2px 4px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .content {
      padding: 8px;
      text-align: center;
    }
    
    h2 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #000;
    }
    
    .logo {
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    button {
      width: 100%;
      padding: 6px;
      background: #c0c0c0;
      border: 2px solid #fff;
      border-right-color: #808080;
      border-bottom-color: #808080;
      box-shadow: 1px 1px 0 #000;
      color: #000;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    
    button:active {
      border: 2px solid #808080;
      border-right-color: #fff;
      border-bottom-color: #fff;
      box-shadow: none;
      transform: translate(1px, 1px);
    }

    .divider {
      border-top: 1px solid #808080;
      border-bottom: 1px solid #fff;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">OwSynth</div>
    <div class="content">
      <h2>OwSynth Player</h2>
      <div class="divider"></div>
      <button id="settings-btn">Settings...</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
